{# Meeting view modal for the "My Meetings" list pages (same design as the calendar modal).
   Cards carry data-meeting (JSON) and a [data-view-meeting] button. #}
<div id="mv-modal" class="fixed inset-0 hidden bg-black bg-opacity-50 items-center justify-center z-50 p-2 sm:p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm sm:max-w-md md:max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="p-6 border-b border-gray-200 flex justify-between items-center">
      <h3 class="text-xl font-bold text-gray-800">Meeting Details</h3>
      <button type="button" onclick="mvClose()" class="text-gray-400 hover:text-gray-600" aria-label="Close">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="p-6" id="mv-body"></div>
    <div class="p-6 border-t border-gray-200 bg-gray-50 rounded-b-2xl flex justify-end">
      <button type="button" onclick="mvClose()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium">Close</button>
    </div>
  </div>
</div>
{% include 'components/meeting_modal_extras.html' %}
<script>
function mvOpen(card) {
  var raw = card && card.getAttribute('data-meeting'); if (!raw) return;
  var m; try { m = JSON.parse(raw); } catch (e) { return; }
  m.date = new Date(m.date);
  if (m.status !== 'cancelled') m.status = m.date.getTime() > Date.now() ? 'upcoming' : 'completed';
  mmRender(document.getElementById('mv-body'), m, { participants: m.participants || [] });
  var el = document.getElementById('mv-modal'); el.classList.remove('hidden'); el.classList.add('flex');
}
function mvClose() { var el = document.getElementById('mv-modal'); el.classList.add('hidden'); el.classList.remove('flex'); }
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-view-meeting]');
  if (b) { e.preventDefault(); mvOpen(b.closest('.meeting-card')); return; }
  if (e.target.id === 'mv-modal') mvClose();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') mvClose(); });
</script>
