<script>
// Shared meeting-modal extras for mentor, mentee, and institution calendars:
// exact parity with institution meeting detail modal design.
// Usage: mmRender(containerEl, meeting, { hideLink: bool, mentors: [...], mentees: [...], participants: [...] })
var _mmMeeting = null, _mmAgendaFull = '', _mmAgendaShort = '';
function mmEsc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function mmReal(l) { return !!l && l.indexOf('teams.live.com/meet/create') === -1 && l.indexOf('meet.google.com/new') === -1; }

function mmRender(el, meeting, opts) {
  if (!el) return;
  opts = opts || {};
  _mmMeeting = meeting;
  var full = String(meeting.description || '').trim();
  var agendaHtml;
  if (!full || full === 'No description provided') {
    agendaHtml = '<span class="text-gray-400">No agenda added.</span>';
  } else {
    var first = full.split(/\n\s*\n|\n--- /)[0].replace(/\s+/g, ' ').trim();
    var limit = 110;
    var shortText = first.length > limit ? first.slice(0, limit).replace(/\s+\S*$/, '') + '…' : first;
    _mmAgendaFull = full; _mmAgendaShort = shortText;
    var more = first.length > limit || full.length > first.length + 2;
    agendaHtml = '<span id="mm-agenda-text">' + mmEsc(shortText) + '</span>' +
      (more ? ' <button type="button" id="mm-agenda-toggle" onclick="mmToggleAgenda()" class="ml-1 text-blue-600 hover:underline text-xs font-medium">Show more</button>' : '');
  }

  var cancelled = meeting.status === 'cancelled', upcoming = meeting.status === 'upcoming';
  var st = meeting.status ? meeting.status.charAt(0).toUpperCase() + meeting.status.slice(1) : '';
  var d = new Date(meeting.date);
  var dateTxt = isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
  var icoCal = '<svg class="w-3.5 h-3.5 inline mr-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>';
  var icoClk = '<svg class="w-3.5 h-3.5 inline mr-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
  
  var html = '<div class="space-y-4"><div>' +
    '<div class="flex items-center gap-2 flex-wrap mb-1">' +
    ((meeting.meeting_type && meeting.meeting_type !== 'standard') ? '<span class="px-2.5 py-0.5 rounded-full text-xs font-bold ' + (meeting.badge_bg || 'bg-sky-100') + ' ' + (meeting.badge_text || 'text-sky-800') + ' border ' + (meeting.badge_border || 'border-sky-300') + '">' + mmEsc(meeting.type || 'Mentoring') + '</span>' : '') +
    '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ' + (upcoming ? 'bg-blue-100 text-blue-800 border border-blue-200' : meeting.status === 'completed' ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200') + '">' + mmEsc(st) + '</span></div>' +
    '<h4 class="text-lg font-bold text-gray-900 tracking-tight' + (cancelled ? ' line-through opacity-70' : '') + '">' + mmEsc(meeting.title) + '</h4>' +
    '<p class="text-xs text-gray-500 mt-1 flex items-center gap-2 flex-wrap"><span>' + icoCal + mmEsc(dateTxt) + '</span><span>&bull;</span><span>' + icoClk + mmEsc(meeting.duration) + ' min</span></p></div>' +
    '<div class="text-sm text-gray-700 bg-gray-50/80 px-3.5 py-2.5 rounded-xl border border-gray-100 leading-relaxed">' + agendaHtml + '</div>';

  if (cancelled) {
    html += '<div class="rounded-xl border border-red-200 bg-red-50 px-3.5 py-3 text-sm text-red-700">This session was cancelled.</div>';
  }

  var showLink = !opts.hideLink && upcoming;
  if (showLink) {
    var has = mmReal(meeting.meet_link), link = mmEsc(meeting.meet_link || '');
    html += '<div class="rounded-xl border border-blue-100 bg-blue-50/60 p-3.5">' +
      '<div class="flex flex-wrap items-center gap-2">' +
      (has ? '<a href="' + link + '" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>Join Meeting</a>'
           : '<a href="https://teams.live.com/meet/create" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-purple-600 text-white text-sm font-semibold rounded-lg hover:bg-purple-700 transition">Create in Teams</a>') +
      '<button type="button" onclick="mmCopy(this)" ' + (has ? '' : 'disabled') + ' class="inline-flex items-center gap-1.5 px-3 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition disabled:opacity-50 disabled:cursor-not-allowed"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg><span>Copy link</span></button>' +
      '<div class="relative">' +
      '<button type="button" onclick="mmToggleSync(event)" class="inline-flex items-center gap-1.5 px-3 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>Sync to calendar</button>' +
      '<div id="mm-sync-menu" class="hidden absolute left-0 mt-1 w-52 bg-white border border-gray-200 rounded-lg shadow-lg z-20 py-1 text-sm">' +
      '<a href="#" onclick="mmGoogle(event)" class="block px-3 py-2 hover:bg-gray-50 text-gray-700">Google Calendar</a>' +
      '<a href="#" onclick="mmIcs(event)" class="block px-3 py-2 hover:bg-gray-50 text-gray-700">Outlook / Apple (.ics file)</a>' +
      '</div></div></div>' +
      '<div class="mt-2.5 flex items-center gap-2 text-xs min-w-0"><span class="text-gray-500 shrink-0">Link:</span>' +
      (has ? '<a href="' + link + '" target="_blank" rel="noopener" class="truncate text-blue-600 hover:underline" title="' + link + '">' + link + '</a>'
           : '<span class="text-gray-400 italic">No meeting link has been added yet.</span>') +
      '</div></div>';
  }

  // Participants resolution (Mentors column and Mentees column)
  var mentorsList = opts.mentors || (opts.participants || []).filter(function (x) { return x && x.role === 'Mentor'; });
  if (!mentorsList.length && meeting.mentor) {
    mentorsList = [{ name: meeting.mentor, email: meeting.mentor_email }];
  }
  var menteesList = opts.mentees || (opts.participants || []).filter(function (x) { return x && x.role === 'Mentee'; });
  if (!menteesList.length && meeting.mentee) {
    menteesList = [{ name: meeting.mentee, email: meeting.mentee_email }];
  }

  var mentorsHtml = '';
  if (mentorsList.length > 0) {
    mentorsHtml = '<div class="space-y-2">' +
      '<div class="flex items-center justify-between"><span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Mentor' + (mentorsList.length > 1 ? 's (' + mentorsList.length + ')' : '') + '</span></div>' +
      '<div class="space-y-2 max-h-44 overflow-y-auto pr-1">' +
      mentorsList.map(function(m) {
        var n = m.name || 'Unknown Mentor', e = m.email || '';
        return '<div class="flex items-center space-x-3 p-2.5 rounded-xl bg-blue-50/70 border border-blue-100/80">' +
          '<div class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center shrink-0 text-sm shadow-sm">' + mmEsc(n.charAt(0).toUpperCase()) + '</div>' +
          '<div class="min-w-0 flex-1"><p class="text-sm font-semibold text-gray-900 truncate">' + mmEsc(n) + '</p>' + (e ? '<p class="text-xs text-gray-500 truncate">' + mmEsc(e) + '</p>' : '') + '</div>' +
          '</div>';
      }).join('') + '</div></div>';
  } else {
    mentorsHtml = '<div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-xs text-gray-500">No mentor assigned</div>';
  }

  var menteesHtml = '';
  var isSgm = (meeting.meeting_type === 'sgm' || meeting.is_sgm);
  if (menteesList.length > 0) {
    menteesHtml = '<div class="space-y-2">' +
      '<div class="flex items-center justify-between"><span class="text-xs font-bold text-gray-500 uppercase tracking-wider">' + (isSgm ? 'Small Group Mentees' : 'Mentee') + (menteesList.length > 1 ? ' (' + menteesList.length + ')' : '') + '</span>' +
      (isSgm ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">SGM Group</span>' : '') + '</div>' +
      '<div class="space-y-2 max-h-44 overflow-y-auto pr-1">' +
      menteesList.map(function(m) {
        var n = m.name || 'Unknown Mentee', e = m.email || '';
        return '<div class="flex items-center space-x-3 p-2.5 rounded-xl bg-emerald-50/70 border border-emerald-100/80">' +
          '<div class="w-9 h-9 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center shrink-0 text-sm shadow-sm">' + mmEsc(n.charAt(0).toUpperCase()) + '</div>' +
          '<div class="min-w-0 flex-1"><p class="text-sm font-semibold text-gray-900 truncate">' + mmEsc(n) + '</p>' + (e ? '<p class="text-xs text-gray-500 truncate">' + mmEsc(e) + '</p>' : '') + '</div>' +
          '</div>';
      }).join('') + '</div></div>';
  } else {
    menteesHtml = '<div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-xs text-gray-500">No mentee assigned</div>';
  }

  html += '<div><h5 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Participants</h5>' +
    '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-gray-50/50 p-3 rounded-2xl border border-gray-200/70">' +
    '<div>' + mentorsHtml + '</div>' +
    '<div>' + menteesHtml + '</div>' +
    '</div></div>';

  html += '</div>';
  el.innerHTML = html;
}

function mmToggleAgenda() {
  var t = document.getElementById('mm-agenda-text'), b = document.getElementById('mm-agenda-toggle');
  if (!t || !b) return;
  if (b.getAttribute('data-expanded') === '1') { t.textContent = _mmAgendaShort; t.style.whiteSpace = ''; b.textContent = 'Show more'; b.setAttribute('data-expanded', '0'); }
  else { t.textContent = _mmAgendaFull; t.style.whiteSpace = 'pre-wrap'; b.textContent = 'Show less'; b.setAttribute('data-expanded', '1'); }
}
function mmCopy(btn) {
  var link = _mmMeeting && _mmMeeting.meet_link;
  if (!mmReal(link)) return;
  var label = btn.querySelector('span');
  function done() { if (label) { var old = label.textContent; label.textContent = 'Copied ✓'; setTimeout(function () { label.textContent = old; }, 1600); } }
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, fallback); else fallback();
}
function mmToggleSync(e) { if (e) e.stopPropagation(); var m = document.getElementById('mm-sync-menu'); if (m) m.classList.toggle('hidden'); }
document.addEventListener('click', function () { var m = document.getElementById('mm-sync-menu'); if (m) m.classList.add('hidden'); });

function mmParts(m) {
  var d = new Date(m.date); if (isNaN(d.getTime())) d = new Date();
  var end = new Date(d.getTime() + (parseInt(m.duration, 10) || 60) * 60000);
  function f(x) { var p = function (n) { return String(n).padStart(2, '0'); }; return x.getFullYear() + p(x.getMonth() + 1) + p(x.getDate()) + 'T' + p(x.getHours()) + p(x.getMinutes()) + p(x.getSeconds()); }
  return { start: f(d), end: f(end) };
}
function mmGoogle(e) {
  if (e) e.preventDefault();
  var m = _mmMeeting; if (!m) return;
  var c = mmParts(m), link = mmReal(m.meet_link) ? m.meet_link : '';
  window.open('https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent(m.title || 'Meeting') + '&dates=' + c.start + '/' + c.end +
    '&details=' + encodeURIComponent(((m.description || '').split('\n')[0] || '') + (link ? '\nJoin: ' + link : '')) +
    (link ? '&location=' + encodeURIComponent(link) : ''), '_blank', 'noopener');
}
function mmIcs(e) {
  if (e) e.preventDefault();
  var m = _mmMeeting; if (!m) return;
  var c = mmParts(m), link = mmReal(m.meet_link) ? m.meet_link : '';
  function esc(t) { return String(t || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mentor Connect//Meetings//EN', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    'UID:meeting-' + m.id + '@mentor-connect', 'DTSTAMP:' + stamp, 'DTSTART:' + c.start, 'DTEND:' + c.end,
    'SUMMARY:' + esc(m.title), 'DESCRIPTION:' + esc(((m.description || '').split('\n')[0] || '') + (link ? '\nJoin: ' + link : ''))];
  if (link) { lines.push('LOCATION:' + esc(link)); lines.push('URL:' + link); }
  lines.push('END:VEVENT', 'END:VCALENDAR');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' }));
  a.download = 'meeting-' + m.id + '.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
</script>
